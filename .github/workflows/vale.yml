---
name: Vale
on:
  pull_request:
    paths:
      - 'guides/common/**.adoc'
      - '.github/workflows/vale.yml'
      - '.vale/**'
      - .vale.ini
      - .vale-dita.ini

jobs:
  lint-style:
    name: lint style
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch PR diff commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "refs/pull/$PR_NUMBER/head"

      - name: Get changed files
        id: changed-files
        run: |
          changed_files="$(scripts/changed-files.py | paste -sd ' ' -)"
          {
            echo "any_changed=$([[ -n "$changed_files" ]] && echo true || echo false)"
            echo "all_changed_files=$changed_files"
            echo "all_changed_files_count=$(printf '%s\n' "$changed_files" | wc -w)"
          } >> "$GITHUB_OUTPUT"

      - name: List changed files
        run: |
          echo "Any files changed? ${{ steps.changed-files.outputs.any_changed }}"
          echo "Changed files list: ${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Count: ${{ steps.changed-files.outputs.all_changed_files_count }}"

      - name: Install Asciidoctor
        if: steps.changed-files.outputs.any_changed == 'true'
        run: sudo apt-get install -y asciidoctor

      - name: Vale style lint
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: errata-ai/vale-action@v3
        with:
          files: ${{ steps.changed-files.outputs.all_changed_files }}
          filter_mode: diff_context
          vale_flags: "--no-exit --minAlertLevel=error"
          reporter: github-pr-check
          fail_on_error: true

  lint-dita:
    name: lint DITA
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch PR diff commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "refs/pull/$PR_NUMBER/head"

      - name: Get changed files
        id: changed-files
        run: |
          changed_files="$(scripts/changed-files.py --dita | paste -sd ' ' -)"
          {
            echo "any_changed=$([[ -n "$changed_files" ]] && echo true || echo false)"
            echo "all_changed_files=$changed_files"
            echo "all_changed_files_count=$(printf '%s\n' "$changed_files" | wc -w)"
          } >> "$GITHUB_OUTPUT"

      - name: List changed files
        run: |
          echo "Any files changed? ${{ steps.changed-files.outputs.any_changed }}"
          echo "Changed files list: ${{ steps.changed-files.outputs.all_changed_files }}"
          echo "Count: ${{ steps.changed-files.outputs.all_changed_files_count }}"

      - name: Install Asciidoctor
        if: steps.changed-files.outputs.any_changed == 'true'
        run: sudo apt-get install -y asciidoctor

      - name: Vale DITA lint
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: errata-ai/vale-action@v3
        with:
          files: ${{ steps.changed-files.outputs.all_changed_files }}
          filter_mode: file
          vale_flags: "--no-exit --minAlertLevel=warning --config=.vale-dita.ini"
          reporter: github-pr-check
          fail_level: warning
